spring.application.name=backend

# PostgreSQL
# P6Spy settings
spring.datasource.url=jdbc:p6spy:postgresql://localhost/vali_it?currentSchema=bcs_koolitused
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# Normal PostgreSQL settings
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.url=jdbc:postgresql://localhost/vali_it?currentSchema=bcs_koolitused
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# SQL initialization
spring.sql.init.mode=always

# Google AI
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.ai.google.genai.chat.options.max-output-tokens=1024

# Chatbot
# AI API key is read only from the GEMINI_API_KEY environment variable.
chatbot.database-schema=bcs_koolitused
chatbot.max-rows=100
chatbot.query-timeout-ms=5000

# Chatbot handoff
chatbot.handoff.recipient=${CHATBOT_HANDOFF_RECIPIENT:}